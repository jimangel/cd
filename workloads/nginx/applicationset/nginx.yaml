apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx
  namespace: argocd
spec:
  goTemplate: true
  generators:
  - git:
      files:
      - path: clusters/*.yaml
      repoURL: "https://github.com/jimangel/cd.git"
      revision: HEAD
    selector:
      matchLabels:
        workloads.nginx: "deployed"
  template:
    metadata:
      name: 'nginx-{{ if eq .cluster.name "in-cluster" }}local{{ else }}{{ .cluster.friendlyName }}{{ end }}'
      labels:
        workloadType: sre
        environment: "{{ .themes.environment }}"
        # how is this workload deployed in argocd?
        syncType: "helm-remote"
        # for quick ref
        cluster: "{{ .cluster.friendlyName }}"
      finalizers:
      - "resources-finalizer.argocd.argoproj.io"
    spec:
      project: default
      sources:
      - chart: ingress-nginx
        repoURL: https://kubernetes.github.io/ingress-nginx
        targetRevision: '4.11.2'
        helm:
          values: |
            namespace: ingress-nginx
            controller:
              kind: DaemonSet
              service:
                type: NodePort
                externalTrafficPolicy: Local
                nodePorts:
                  http: 80
                  https: 443
              containerPort:
                http: 80
                https: 443
      - repoURL: https://github.com/jimangel/cd.git
        path: workloads/nginx/config/base
        targetRevision: HEAD
        kustomize:
          patches:
          - target:
              kind: Ingress
              name: argocd-server-http-ingress
            patch: |-
              - op: replace
                path: /spec/rules/0/host
                value: argo.{{ if eq .cluster.domain "nip.io" }}{{ index .cluster "a-record" }}{{ else }}{{ .cluster.subdomain }}{{ end }}.{{ .cluster.domain }}
      destination:
        name: '{{ .cluster.name }}'
        # no namespace, cluster wide CRDs...
        namespace: 'ingress-nginx'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true